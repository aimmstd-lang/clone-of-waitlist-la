    <!-- JSON-LD: FAQ Page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Waitlist Lab?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Waitlist Lab is an all-in-one marketing and CRM platform specifically designed for education and training businesses. It replaces dozens of separate tools by bringing your website, sales funnels, email marketing, SMS, bookings, and student management into one unified system."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need technical skills to use it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not at all! Our platform is built to be user-friendly with drag-and-drop builders for websites and funnels, plus pre-built templates specifically for education businesses. If you can use email, you can use Waitlist Lab."
            }
          },
          {
            "@type": "Question",
            "name": "Can I migrate from my current software?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! We make migration seamless. You can easily import your contacts, pipelines, and calendars from your existing tools with just a few clicks."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a long-term contract?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, Waitlist Lab is a month-to-month service. There are no long-term contracts or hidden cancellation fees. You can cancel your subscription at any time."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide customer support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. We offer comprehensive customer support, plus access to our knowledge base and an exclusive community of education business owners."
            }
          }
        ]
      }
    </script>
